services:
  - type: web
    name: campusconnect
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn campusconnect.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: campusconnect-db
          property: connectionString

databases:
  - name: campusconnect-db
    plan: free
